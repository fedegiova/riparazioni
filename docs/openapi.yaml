openapi: 3.0.3
info:
  title: Riparazioni API
  version: 1.0.0
  description: |
    JSON REST API for the repair workflow, equipment master data, photos, and
    read-only access to the legacy reference data in the `DATIDBSTORICO` schema.

    All endpoints are served under the `/api/v1` prefix.

    ## Error model

    Every error response uses the JSON envelope `{"error": "<message>"}`:

    | Status | Meaning |
    |--------|---------|
    | 400 | Validation error (bad date/datetime, missing recharge pair, overdraw, ...) |
    | 404 | Unknown resource id, or stored file missing on disk |
    | 405 | Write method on a read-only resource |
    | 409 | Referential conflict (unknown customer/vehicle/part/cylinder, or deleting a referenced record) |
  contact:
    name: riparazioni

paths:
  # ------------------------------------------------------------------
  # Reference data (read-only, legacy DATIDBSTORICO)
  # ------------------------------------------------------------------
  /api/v1/vehicles:
    get:
      summary: List vehicles
      description: Read-only view of the pre-existing `TBALLESTIMENTI` table. Other methods return 405.
      tags: [reference-data]
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
  /api/v1/vehicles/{vehicle_id}:
    get:
      summary: Get a vehicle
      description: "Id is `TBALLESTIMENTI.ID_INT`."
      tags: [reference-data]
      parameters:
        - $ref: "#/components/parameters/VehicleIdParam"
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/customers:
    get:
      summary: List customers
      description: Read-only view of the pre-existing `VICLIENTI` view. Other methods return 405.
      tags: [reference-data]
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /api/v1/customers/{customer_id}:
    get:
      summary: Get a customer
      tags: [reference-data]
      parameters:
        - $ref: "#/components/parameters/CustomerIdParam"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users:
    get:
      summary: List users
      description: Read-only view of the pre-existing `TBUSERS` table. The password is never exposed. Other methods return 405.
      tags: [reference-data]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /api/v1/users/{user_id}:
    get:
      summary: Get a user
      description: "Id is `TBUSERS.ID_INT`. The password field is never included."
      tags: [reference-data]
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # Equipment (CRUD)
  # ------------------------------------------------------------------
  /api/v1/refrigerators:
    get:
      summary: List refrigerators
      tags: [equipment]
      responses:
        "200":
          description: List of refrigerators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refrigerator"
    post:
      summary: Create a refrigerator
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefrigeratorInput"
      responses:
        "201":
          description: Created refrigerator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refrigerator"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/refrigerators/{refrigerator_id}:
    parameters:
      - $ref: "#/components/parameters/RefrigeratorIdParam"
    get:
      summary: Get a refrigerator
      tags: [equipment]
      responses:
        "200":
          description: Refrigerator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refrigerator"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a refrigerator
      description: Only the fields present in the body are changed.
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefrigeratorInput"
      responses:
        "200":
          description: Updated refrigerator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refrigerator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a refrigerator
      tags: [equipment]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/gas-cylinders:
    get:
      summary: List gas cylinders
      description: Archived cylinders are hidden unless `?archived=true`.
      tags: [equipment]
      parameters:
        - name: archived
          in: query
          required: false
          description: Include archived cylinders when true
          schema:
            type: boolean
      responses:
        "200":
          description: List of gas cylinders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GasCylinder"
    post:
      summary: Create a gas cylinder
      description: When `remaining_weight` is omitted it defaults to `full_weight` (a new cylinder starts full).
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GasCylinderCreate"
      responses:
        "201":
          description: Created gas cylinder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasCylinder"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/gas-cylinders/{cylinder_id}:
    parameters:
      - $ref: "#/components/parameters/CylinderIdParam"
    get:
      summary: Get a gas cylinder
      tags: [equipment]
      responses:
        "200":
          description: Gas cylinder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasCylinder"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a gas cylinder
      description: Only the fields present in the body are changed. The remaining weight is read-only here; it may be seeded at creation only and moves through refills and gas movements, so a body carrying `remaining_weight` is rejected with 400.
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GasCylinderInput"
      responses:
        "200":
          description: Updated gas cylinder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasCylinder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a gas cylinder
      tags: [equipment]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/gas-cylinders/{cylinder_id}/archive:
    parameters:
      - $ref: "#/components/parameters/CylinderIdParam"
    post:
      summary: Archive a gas cylinder
      description: |
        Allowed only when `remaining_weight` is below a quarter of
        `full_weight` (400 otherwise). Archived cylinders are hidden from the
        default list and cannot be recharged until refilled.
      tags: [equipment]
      responses:
        "200":
          description: Archived gas cylinder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasCylinder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/gas-cylinders/{cylinder_id}/restore:
    parameters:
      - $ref: "#/components/parameters/CylinderIdParam"
    post:
      summary: Restore an archived gas cylinder
      description: Clears the archived flag; the remaining weight is unchanged.
      tags: [equipment]
      responses:
        "200":
          description: Restored gas cylinder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasCylinder"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/gas-cylinders/{cylinder_id}/refills:
    parameters:
      - $ref: "#/components/parameters/CylinderIdParam"
    get:
      summary: List refills for a gas cylinder
      tags: [equipment]
      responses:
        "200":
          description: List of refills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refill"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Record a gas cylinder refill
      description: |
        Restores the cylinder to its full weight and clears the archived flag in
        one transaction. A refill is allowed on any cylinder.
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefillInput"
      responses:
        "201":
          description: Created refill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/gas-cylinders/{cylinder_id}/operations:
    parameters:
      - $ref: "#/components/parameters/CylinderIdParam"
    get:
      summary: List a gas cylinder's operation log
      description: |
        The cylinder's gas-affecting history, newest first: its refills plus the
        recharges and recoveries recorded on work-log entries that reference it.
        Each entry carries its source reference.
      tags: [equipment]
      responses:
        "200":
          description: List of operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CylinderOperation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/service-parts:
    get:
      summary: List service parts
      tags: [equipment]
      parameters:
        - name: is_refrigerator_part
          in: query
          required: false
          description: Filter on the refrigerator-part flag
          schema:
            type: boolean
      responses:
        "200":
          description: List of service parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePart"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a service part
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePartInput"
      responses:
        "201":
          description: Created service part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePart"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/service-parts/{part_id}:
    parameters:
      - $ref: "#/components/parameters/PartIdParam"
    get:
      summary: Get a service part
      tags: [equipment]
      responses:
        "200":
          description: Service part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePart"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a service part
      description: Only the fields present in the body are changed.
      tags: [equipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePartInput"
      responses:
        "200":
          description: Updated service part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a service part
      tags: [equipment]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ------------------------------------------------------------------
  # Pictures
  # ------------------------------------------------------------------
  /api/v1/pictures:
    get:
      summary: List pictures
      description: Optionally filtered by owner; the two owner parameters must be given together.
      tags: [pictures]
      parameters:
        - name: owner_type
          in: query
          required: false
          schema:
            type: string
            enum: [repair, spare, cylinder]
        - name: owner_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of picture metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Picture"
    post:
      summary: Upload a picture
      description: |
        Multipart upload, attached to exactly one owner. The file is stored as
        `UPLOAD_DIR/<owner_type>/YYYY-MM-DD-SEQ.<ext>` and the `path` field
        records the location relative to `UPLOAD_DIR`.
      tags: [pictures]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, owner_type, owner_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file; it is decoded and stored resized to a 2880 px longest edge, with a 320 px minified view created alongside it. A file that is not a decodable image is rejected.
                owner_type:
                  type: string
                  enum: [repair, spare, cylinder]
                owner_id:
                  type: integer
                uploaded_by:
                  type: string
                  description: Optional author name stored in the metadata
      responses:
        "201":
          description: Created picture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picture"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/pictures/{picture_id}:
    parameters:
      - $ref: "#/components/parameters/PictureIdParam"
    get:
      summary: Get picture metadata
      tags: [pictures]
      responses:
        "200":
          description: Picture metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picture"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a picture
      description: Removes both the metadata record and the stored file.
      tags: [pictures]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pictures/{picture_id}/file:
    get:
      summary: Download the stored file
      description: Serves the file with a content type derived from its extension. The location is resolved only from the stored metadata (path traversal is not possible).
      tags: [pictures]
      parameters:
        - $ref: "#/components/parameters/PictureIdParam"
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pictures/{picture_id}/thumbnail:
    get:
      summary: Download the minified view
      description: Serves the picture's minified derivative (longest edge at most 320 px). When a picture has no derivative yet it is generated from the stored file and recorded on first request. The location is resolved only from the stored metadata (path traversal is not possible).
      tags: [pictures]
      parameters:
        - $ref: "#/components/parameters/PictureIdParam"
      responses:
        "200":
          description: Thumbnail image content
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # Repairs
  # ------------------------------------------------------------------
  /api/v1/repairs:
    get:
      summary: List repairs
      description: Summary form (no `work_log` / `parts`). Use the detail endpoint for those.
      tags: [repairs]
      parameters:
        - name: customer
          in: query
          required: false
          schema:
            type: integer
        - name: vehicle
          in: query
          required: false
          schema:
            type: integer
        - name: refrigerator
          in: query
          required: false
          schema:
            type: integer
        - name: start_date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: start_date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of repairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repair"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a repair
      description: |
        `customer` and `vehicle` are validated against the legacy reference data
        (409 when unknown). `start_data` defaults to the current time when omitted.
      tags: [repairs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairCreate"
      responses:
        "201":
          description: Created repair (with empty `work_log` and `parts`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/repairs/export:
    get:
      summary: Export repairs as an Excel workbook
      description: |
        Honors the same filters as the repairs list and returns a real `.xlsx`
        workbook (one row per matching repair) as a download.
      tags: [repairs]
      parameters:
        - name: customer
          in: query
          required: false
          schema:
            type: integer
        - name: vehicle
          in: query
          required: false
          schema:
            type: integer
        - name: refrigerator
          in: query
          required: false
          schema:
            type: integer
        - name: start_date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: start_date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/repairs/{repair_id}:
    parameters:
      - $ref: "#/components/parameters/RepairIdParam"
    get:
      summary: Get a repair (detail)
      description: Includes the repair's `work_log` entries and associated `parts`.
      tags: [repairs]
      responses:
        "200":
          description: Repair detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a repair
      description: |
        Only the fields present in the body are changed. Setting `end_data` marks the
        repair completed; setting it to `null` reopens it. Providing `parts` replaces
        the full part set.
      tags: [repairs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairUpdate"
      responses:
        "200":
          description: Updated repair detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a repair
      description: |
        Removes the repair together with its work-log entries and part associations.
        Cylinder balances recorded on its recharges are restored in the same transaction.
      tags: [repairs]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # Work log (nested under a repair)
  # ------------------------------------------------------------------
  /api/v1/repairs/{repair_id}/work-log:
    get:
      summary: List work-log entries
      tags: [work-log]
      parameters:
        - $ref: "#/components/parameters/RepairIdParam"
      responses:
        "200":
          description: Work-log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkLogEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Add a work-log entry
      description: |
        Creates a work log. `operator` is required and must be one of the
        configured operators. When `start_time` is given without `end_time`, a
        running entry is created and any running entry for the same operator on
        an active repair is stopped at this start time. Recording a completed
        historical entry does not stop a timer. Archived repairs are read-only
        (409) until reopened.

        Gas recharge rules:

        - a recharge needs both `gas_recharge` (cylinder id) and `gas_recharge_weight`;
          one without the other is rejected (400);
        - any entry carrying gas data needs a `gas_system_state`;
        - `PIENO` entries must not carry cylinder or weight data;
        - the cylinder's `remaining_weight` is decreased by the recharged weight in the
          same transaction;
        - recharging more than the cylinder's remaining weight is rejected (400) and
          leaves the balance unchanged;
        - an unknown cylinder id is rejected (409).
      tags: [work-log]
      parameters:
        - $ref: "#/components/parameters/RepairIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkLogCreate"
      responses:
        "201":
          description: Created work-log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/repairs/{repair_id}/work-log/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/RepairIdParam"
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a work-log entry
      description: |
        Non-gas fields are patched individually. When any gas field is present, the
        entry's whole gas dataset is replaced: the previous balance impact is reverted
        and the new one applied (validated first).
      tags: [work-log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkLogInput"
      responses:
        "200":
          description: Updated work-log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete a work-log entry
      description: Restores the cylinder balance when the entry recorded a recharge.
      tags: [work-log]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # Settings
  # ------------------------------------------------------------------
  /api/v1/settings:
    get:
      summary: List settings
      description: |
        Every stored setting as a name-to-value map. Known settings that have never
        been written appear with their default value (empty operators, every day
        closed, no holidays).
      tags: [settings]
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"
    put:
      summary: Update several settings
      description: |
        Upserts each provided setting in one atomic request. A value that is invalid
        for a known setting rejects the whole request (400) and changes nothing.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsMap"
      responses:
        "200":
          description: The settings map after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/settings/{name}:
    parameters:
      - $ref: "#/components/parameters/SettingNameParam"
    get:
      summary: Get a setting
      description: A known setting that has never been written returns its default; an unknown name is 404.
      tags: [settings]
      responses:
        "200":
          description: The setting value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsValue"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Create or replace a setting
      description: |
        Upserts one setting. Known settings are validated (400 on an invalid value);
        unknown names accept any JSON value.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsValue"
      responses:
        "200":
          description: The stored setting value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsValue"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      summary: Delete a setting
      description: Removes the stored value; a known setting reverts to its default on the next read.
      tags: [settings]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    VehicleIdParam:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: integer
    CustomerIdParam:
      name: customer_id
      in: path
      required: true
      schema:
        type: integer
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    RefrigeratorIdParam:
      name: refrigerator_id
      in: path
      required: true
      schema:
        type: integer
    CylinderIdParam:
      name: cylinder_id
      in: path
      required: true
      schema:
        type: integer
    PartIdParam:
      name: part_id
      in: path
      required: true
      schema:
        type: integer
    PictureIdParam:
      name: picture_id
      in: path
      required: true
      schema:
        type: integer
    RepairIdParam:
      name: repair_id
      in: path
      required: true
      schema:
        type: integer
    EntryIdParam:
      name: entry_id
      in: path
      required: true
      schema:
        type: integer
    SettingNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Referential conflict (unknown reference, or record still referenced)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: customer 99999 does not exist

    # --- reference data (read-only) -------------------------------------
    Vehicle:
      type: object
      readOnly: true
      required: [id]
      properties:
        id:
          type: integer
          description: TBALLESTIMENTI.ID_INT
        id_str:
          type: string
          description: Zero-padded legacy id
        nominativo_id:
          type: string
        targa:
          type: string
          description: License plate
        autocarro:
          type: string
        carrozzeria:
          type: string
        modello:
          type: string
        classe:
          type: string
        commessa:
          type: string
        prod:
          type: string
          format: date
        atp:
          type: string
          format: date
        progressivo:
          type: integer
        data_rilascio:
          type: string
          format: date
        ol:
          type: string
        note:
          type: string
        cpccchk:
          type: string
    Customer:
      type: object
      readOnly: true
      required: [id]
      properties:
        id:
          type: integer
        n_nominativo:
          type: integer
        cliente:
          type: string
          description: Customer name
        ncliente:
          type: string
        via:
          type: string
        cap:
          type: string
        citta:
          type: string
        prov:
          type: string
        tel:
          type: string
        fax:
          type: string
        cell:
          type: string
        email:
          type: string
        note:
          type: string
    User:
      type: object
      readOnly: true
      required: [id]
      properties:
        id:
          type: integer
          description: TBUSERS.ID_INT
        id_str:
          type: string
        name:
          type: string
        last_login:
          type: string
          format: date

    # --- equipment ---------------------------------------------------------
    Refrigerator:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        serial_nr:
          type: string
          maxLength: 32
        model:
          type: string
          maxLength: 32
        brand:
          type: string
          maxLength: 32
        gas_kg:
          type: number
        notes:
          type: string
          maxLength: 4000
    RefrigeratorInput:
      type: object
      properties:
        serial_nr:
          type: string
        model:
          type: string
        brand:
          type: string
        gas_kg:
          type: number
        notes:
          type: string
    GasCylinder:
      type: object
      required: [id, full_weight]
      properties:
        id:
          type: integer
        gas_kind:
          type: string
          maxLength: 32
          example: R134a
        serial_nr:
          type: string
          maxLength: 32
        model:
          type: string
          maxLength: 32
        full_weight:
          type: number
        remaining_weight:
          type: number
        notes:
          type: string
          maxLength: 4000
        archived:
          type: boolean
          description: Retired cylinder; hidden from the default list
    GasCylinderInput:
      type: object
      properties:
        gas_kind:
          type: string
        serial_nr:
          type: string
        model:
          type: string
        full_weight:
          type: number
        remaining_weight:
          type: number
          description: Optional initial balance; accepted only at creation (defaults to full_weight) and rejected on update
        notes:
          type: string
    GasCylinderCreate:
      allOf:
        - $ref: "#/components/schemas/GasCylinderInput"
        - type: object
          required: [full_weight]
    Refill:
      type: object
      required: [id, gas_cylinder_id, date]
      properties:
        id:
          type: integer
        gas_cylinder_id:
          type: integer
        date:
          type: string
          format: date
        reference:
          type: string
          nullable: true
    RefillInput:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Defaults to today when omitted
        reference:
          type: string
          nullable: true
    CylinderOperation:
      type: object
      required: [kind]
      description: |
        One gas-affecting operation on a cylinder: a refill, or a recharge or
        recovery recorded on a work-log entry that references the cylinder.
      properties:
        kind:
          type: string
          enum: [refill, recharge, recovery, recovery_recharge]
        id:
          type: integer
          nullable: true
          description: Refill id (refill entries only)
        date:
          type: string
          nullable: true
          description: Refill date, or the work-log entry's start time
        reference:
          type: string
          nullable: true
          description: Refill reference text (refill entries only)
        repair_id:
          type: integer
          nullable: true
          description: Source repair (movement entries only)
        work_log_id:
          type: integer
          nullable: true
          description: Source work-log entry (movement entries only)
        operator:
          type: string
          nullable: true
          description: Operator that recorded the movement (movement entries only)
        gas_system_state:
          type: string
          nullable: true
          description: Gas system state of the movement (movement entries only)
        recharged_weight:
          type: number
          nullable: true
        recovered_weight:
          type: number
          nullable: true
        remaining_weight:
          type: number
          nullable: true
          description: Cylinder balance after this operation
    ServicePart:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 64
        supplier:
          type: string
          maxLength: 64
        kind:
          type: string
          maxLength: 64
        price:
          type: integer
        is_refrigerator_part:
          type: boolean
        notes:
          type: string
          maxLength: 4000
    ServicePartInput:
      type: object
      properties:
        name:
          type: string
        supplier:
          type: string
        kind:
          type: string
        price:
          type: integer
        is_refrigerator_part:
          type: boolean
        notes:
          type: string

    # --- pictures ------------------------------------------------------------
    Picture:
      type: object
      required: [id, path, owner_type, owner_id]
      properties:
        id:
          type: integer
        path:
          type: string
          description: File location relative to UPLOAD_DIR (e.g. repair/2026-11-21-0007.jpg)
        owner_type:
          type: string
          enum: [repair, spare, cylinder]
          description: The kind of record the picture belongs to
        owner_id:
          type: integer
          description: Id of the owning repair, spare, or gas cylinder
        uploaded_by:
          type: string
          nullable: true
        uploaded_date:
          type: string
          format: date-time

    # --- repairs ---------------------------------------------------------------
    RepairPartRef:
      type: object
      description: A part association as accepted in create/update requests
      required: [id_part, quantity]
      properties:
        id_part:
          type: integer
          description: SERVICE_PARTS id
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          nullable: true
          description: Unit price at time of use; falls back to the part's price when omitted
    RepairPart:
      type: object
      readOnly: true
      required: [id, id_part, quantity]
      properties:
        id:
          type: integer
        id_part:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: integer
          nullable: true
        part:
          $ref: "#/components/schemas/ServicePart"
    Repair:
      type: object
      required: [id, start_data, customer_name, total_hours]
      properties:
        id:
          type: integer
        customer:
          type: integer
          nullable: true
          description: VICLIENTI id
        customer_name:
          type: string
          nullable: true
          description: Resolved from the customers reference data; null when unknown
        vehicle:
          type: integer
          nullable: true
          description: TBALLESTIMENTI.ID_INT
        refrigerator:
          type: integer
          nullable: true
        start_data:
          type: string
          format: date-time
        end_data:
          type: string
          format: date-time
          nullable: true
          description: null while the repair is open
        delivery_date:
          type: string
          format: date
          nullable: true
          description: Delivery date requested by the customer
        total_hours:
          type: number
          description: |
            Worked hours. While the repair is active this is computed from its
            completed work-log entries: only the time falling inside the
            configured weekday working hours and outside configured holiday
            ranges counts. Archiving freezes the value; later calendar edits do
            not change an archived repair until it is reopened.
        gas_used:
          type: number
          description: Sum of the recharged weights recorded on the repair's work-log entries, in kg
        notes:
          type: string
          maxLength: 4000
    RepairDetail:
      allOf:
        - $ref: "#/components/schemas/Repair"
        - type: object
          properties:
            work_log:
              type: array
              items:
                $ref: "#/components/schemas/WorkLogEntry"
            parts:
              type: array
              items:
                $ref: "#/components/schemas/RepairPart"
            pictures:
              type: array
              items:
                $ref: "#/components/schemas/Picture"
    RepairCreate:
      type: object
      properties:
        customer:
          type: integer
          description: Must exist in the customers reference data (409 otherwise)
        vehicle:
          type: integer
          description: Must exist in the vehicles reference data (409 otherwise)
        refrigerator:
          type: integer
          nullable: true
        start_data:
          type: string
          format: date-time
          description: Defaults to the current time when omitted
        delivery_date:
          type: string
          format: date
          nullable: true
          description: Delivery date requested by the customer
        notes:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/RepairPartRef"
    RepairUpdate:
      type: object
      description: "Partial update: only the fields present are changed"
      properties:
        customer:
          type: integer
        vehicle:
          type: integer
        start_data:
          type: string
          format: date-time
        refrigerator:
          type: integer
          nullable: true
        notes:
          type: string
        end_data:
          type: string
          format: date-time
          nullable: true
          description: |
            Set to archive the repair, null to reopen it. Archiving fails with
            409 while a work log is still running: stop the timers first. A
            successful archive freezes `total_hours`; reopening makes it live
            again and the next archive stores a new total.
        delivery_date:
          type: string
          format: date
          nullable: true
          description: Delivery date requested by the customer (null clears it)
        parts:
          type: array
          description: When present, replaces the full part set
          items:
            $ref: "#/components/schemas/RepairPartRef"

    # --- work log -----------------------------------------------------------------
    WorkLogEntry:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        operator:
          type: string
          maxLength: 32
          nullable: true
        description:
          type: string
          maxLength: 4000
          nullable: true
          description: Free-text note about the work performed
        gas_system_state:
          type: string
          enum: [VUOTO, PIENO, RECUPERO, RICUPERO_RICARICA]
          nullable: true
          description: Gas system state of the operation
        gas_recharge:
          type: integer
          nullable: true
          description: Cylinder id used for the recharge
        gas_recharge_weight:
          type: number
          nullable: true
          description: Kg of gas recharged
        gas_recovered_weight:
          type: number
          nullable: true
          description: Kg of gas recovered; adds to the cylinder balance
    WorkLogCreate:
      type: object
      required: [operator]
      description: |
        Create a running or historical work log. `operator` must be one of the
        configured operators; an unknown or omitted operator is rejected (400).
        A running entry (start time, no end time) stops the same operator's
        previously running entry at this start time.
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        operator:
          type: string
          maxLength: 32
          description: A configured operator name
        description:
          type: string
          maxLength: 4000
          nullable: true
        gas_system_state:
          type: string
          enum: [VUOTO, PIENO, RECUPERO, RICUPERO_RICARICA]
          nullable: true
        gas_recharge:
          type: integer
          nullable: true
        gas_recharge_weight:
          type: number
          nullable: true
        gas_recovered_weight:
          type: number
          nullable: true
    WorkLogInput:
      type: object
      description: |
        Partial update of a work log. Every field is optional; non-gas fields are
        patched individually. If any gas field is present the whole gas dataset
        (state, cylinder, weights) is replaced. An omitted operator keeps the
        stored one; a changed operator must be configured. Archived repairs are
        read-only (409) until reopened.
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        operator:
          type: string
          maxLength: 32
        description:
          type: string
          maxLength: 4000
          nullable: true
        gas_system_state:
          type: string
          enum: [VUOTO, PIENO, RECUPERO, RICUPERO_RICARICA]
          nullable: true
        gas_recharge:
          type: integer
          nullable: true
        gas_recharge_weight:
          type: number
          nullable: true
        gas_recovered_weight:
          type: number
          nullable: true

    # --- settings -------------------------------------------------------------
    SettingsMap:
      type: object
      description: A name-to-value map of application settings. Values are JSON documents.
      additionalProperties: true
    SettingsValue:
      description: |
        A setting value as a JSON document. The known settings are `operators`
        (array of strings), `working_hours` (weekday name to a list of
        `[HH:MM, HH:MM]` intervals, an empty list meaning closed), `holidays`
        (four-digit year to a list of `{from, to, name}` date ranges within that
        year), and `gas_types` (array of gas type names).

tags:
  - name: reference-data
    description: Read-only access to the legacy DATIDBSTORICO objects
  - name: equipment
    description: CRUD for owned master data (refrigerators, gas cylinders, service parts)
  - name: pictures
    description: Photo file storage and delivery
  - name: repairs
    description: Repair lifecycle
  - name: work-log
    description: Work-log entries nested under a repair, with gas-recharge bookkeeping
  - name: settings
    description: Application settings as a JSON name/value store
